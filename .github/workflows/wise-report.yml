name: Wise Report Bot

on:
  schedule:
    # GitHub Actions cron is UTC.
    # Sun-Thu 22:10, 22:50 UTC = Mon-Fri 07:10, 07:50 KST.
    - cron: "10,50 22 * * 0-4"
    # Sun-Thu 23:05, 23:30 UTC = Mon-Fri 08:05, 08:30 KST.
    - cron: "5,30 23 * * 0-4"
  workflow_dispatch:

jobs:
  send-wise-report:
    runs-on: ubuntu-latest
    concurrency:
      group: wise-report-bot
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send WiseReport summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wise_report_bot.py --skip-non-business-day

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          TRIGGER: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          message=$(cat <<EOF
          [Wise Report Bot 실패]
          저장소: $REPOSITORY
          브랜치: $BRANCH
          워크플로우: $WORKFLOW
          트리거: $TRIGGER
          상태: $JOB_STATUS
          실행 링크: $RUN_URL
          EOF
          )

          curl -fsS --retry 3 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true"
